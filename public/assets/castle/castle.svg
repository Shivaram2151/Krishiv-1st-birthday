<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 400 390" role="img" aria-label="Fairy-tale castle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#E4E4F2"/></linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2F0F8"/><stop offset="1" stop-color="#D9DCEE"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1978E8"/><stop offset=".55" stop-color="#0754BB"/><stop offset="1" stop-color="#0A2E6B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE4A0"/><stop offset="1" stop-color="#C98A2B"/></linearGradient>
    <radialGradient id="win" cx=".5" cy=".6" r=".7"><stop offset="0" stop-color="#FFF4C8"/><stop offset="1" stop-color="#EAB95B"/></radialGradient>
  </defs>
  <g id="flag"><path d="M0 0 v-22" stroke="#C98A2B" stroke-width="2"/><path d="M0 -22 q10 3 18 -2 v10 q-8 5 -18 2 Z" fill="url(#gold)"/></g>
  <!-- back towers -->
  <rect x="62" y="150" width="44" height="190" fill="url(#wall2)"/>
  <path d="M56 152 L84 70 L112 152 Z" fill="url(#roof)"/>
  <use href="#flag" x="84" y="70"/>
  <rect x="294" y="150" width="44" height="190" fill="url(#wall2)"/>
  <path d="M288 152 L316 70 L344 152 Z" fill="url(#roof)"/>
  <use href="#flag" x="316" y="70"/>
  <!-- central keep -->
  <rect x="140" y="120" width="120" height="220" fill="url(#wall)"/>
  <rect x="176" y="70" width="48" height="90" fill="url(#wall)"/>
  <path d="M168 74 L200 -2 L232 74 Z" fill="url(#roof)"/>
  <use href="#flag" x="200" y="0"/>
  <path d="M140 124 L152 110 L164 124 L176 110 L188 124 L200 110 L212 124 L224 110 L236 124 L248 110 L260 124 Z" fill="url(#wall)"/>
  <rect x="140" y="124" width="120" height="6" fill="url(#gold)"/>
  <!-- side towers -->
  <rect x="104" y="190" width="40" height="150" fill="url(#wall)"/>
  <path d="M98 192 L124 124 L150 192 Z" fill="url(#roof)"/>
  <rect x="256" y="190" width="40" height="150" fill="url(#wall)"/>
  <path d="M250 192 L276 124 L302 192 Z" fill="url(#roof)"/>
  <!-- outer walls -->
  <rect x="20" y="250" width="360" height="90" fill="url(#wall)"/>
  <path d="M20 254 h18 v-14 h18 v14 h18 v-14 h18 v14 h18 v-14 h18 v14 M254 254 h18 v-14 h18 v14 h18 v-14 h18 v14 h18 v-14 h18 v14 h18" fill="none" stroke="#D9DCEE" stroke-width="3"/>
  <rect x="20" y="254" width="360" height="5" fill="url(#gold)"/>
  <!-- windows -->
  <g fill="url(#win)">
    <path d="M192 96 a8 8 0 0 1 16 0 v16 h-16 Z"/>
    <path d="M160 160 a7 7 0 0 1 14 0 v18 h-14 Z"/><path d="M226 160 a7 7 0 0 1 14 0 v18 h-14 Z"/>
    <path d="M118 212 a6 6 0 0 1 12 0 v16 h-12 Z"/><path d="M270 212 a6 6 0 0 1 12 0 v16 h-12 Z"/>
    <path d="M78 186 a6 6 0 0 1 12 0 v14 h-12 Z"/><path d="M310 186 a6 6 0 0 1 12 0 v14 h-12 Z"/>
    <circle cx="200" cy="148" r="9"/>
  </g>
  <!-- door -->
  <path d="M176 340 v-46 a24 24 0 0 1 48 0 v46 Z" fill="#0C2C5A"/>
  <path d="M176 340 v-46 a24 24 0 0 1 48 0 v46" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <path d="M200 270 v70" stroke="#EAB95B" stroke-width="1.5" opacity=".6"/>
</svg>
