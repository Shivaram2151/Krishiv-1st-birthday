<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#071B3D" />
  <title>Organizer Dashboard · Krishiv Turns One</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #071B3D; --blue: #0754BB; --gold: #EAB95B; --gold-soft: #FFF3D6; --ivory: #FFFAF0;
      --text: #10264D; --muted: #62718B; --line: #ECE3CF; --ok: #1B7F4B; --ok-bg: #E3F6EA; --bad: #B42318; --bad-bg: #FDECEA;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: 'DM Sans', system-ui, sans-serif; background: var(--ivory); color: var(--text); }
    button, input { font: inherit; }
    .hidden { display: none !important; }

    /* Header */
    header {
      background: radial-gradient(120% 140% at 80% 0%, #0C46A0 0%, var(--navy) 60%);
      color: #fff; padding: 20px 16px 22px; padding-top: max(20px, env(safe-area-inset-top));
      border-bottom: 3px solid var(--gold);
    }
    .head-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .head-inner img { width: 46px; height: auto; flex: none; }
    header h1 { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: clamp(1.3rem, 4vw, 1.7rem); color: var(--gold); }
    header p { margin: 2px 0 0; color: #C9D6EE; font-size: .88rem; }
    #logout { margin-left: auto; background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }

    main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }

    /* Buttons */
    button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: .95rem; transition: transform .1s, filter .15s; }
    button:active { transform: scale(.97); }
    button:hover { filter: brightness(1.05); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .primary { background: var(--blue); color: #fff; }
    .gold { background: var(--gold); color: var(--navy); }
    .ghost { background: #fff; color: var(--blue); box-shadow: inset 0 0 0 1.5px #C9D7EE; }
    .danger { background: var(--bad-bg); color: var(--bad); }
    .sm { min-height: 38px; padding: 0 14px; font-size: .88rem; }

    /* Login */
    .login { max-width: 400px; margin: 7vh auto 0; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 28px 22px; text-align: center; box-shadow: 0 18px 40px -24px rgba(7,27,61,.45); }
    .login img { width: 64px; margin-bottom: 6px; }
    .login h2 { margin: 0 0 4px; font-family: 'Playfair Display', Georgia, serif; font-style: italic; color: var(--navy); }
    .login p { margin: 0 0 18px; color: var(--muted); font-size: .92rem; }
    .login label { display: block; text-align: left; font-weight: 700; font-size: .88rem; margin-bottom: 6px; }
    .login input { width: 100%; min-height: 48px; padding: 10px 14px; font-size: 16px; border: 1.5px solid #D9E1EE; border-radius: 12px; }
    .login button { width: 100%; margin-top: 14px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .stat b { display: block; font-size: 1.8rem; line-height: 1.1; color: var(--blue); }
    .stat span { color: var(--muted); font-size: .85rem; }
    .stat.hl { background: var(--navy); border-color: var(--navy); }
    .stat.hl b { color: var(--gold); } .stat.hl span { color: #C9D6EE; }

    /* Tabs */
    .tabs { display: flex; gap: 6px; padding: 5px; background: #fff; border: 1px solid var(--line); border-radius: 999px; margin-bottom: 14px; overflow-x: auto; }
    .tabs button { flex: 1; white-space: nowrap; background: transparent; color: var(--muted); }
    .tabs button[aria-selected="true"] { background: var(--navy); color: #fff; }
    .badge { display: inline-block; min-width: 22px; padding: 1px 7px; margin-left: 6px; border-radius: 999px; background: var(--gold); color: var(--navy); font-size: .75rem; }
    .badge:empty { display: none; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .toolbar input { flex: 1 1 200px; min-height: 44px; padding: 0 14px; font-size: 16px; border: 1.5px solid #D9E1EE; border-radius: 999px; background: #fff; }

    /* Cards */
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .item { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .item h3 { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
    .item .msg { margin: 0; padding: 10px 12px; background: var(--ivory); border-radius: 10px; white-space: pre-line; overflow-wrap: anywhere; font-size: .93rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .85rem; }
    .meta a { color: var(--blue); font-weight: 700; text-decoration: none; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
    .pill { flex: none; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
    .yes { background: var(--ok-bg); color: var(--ok); } .no { background: var(--bad-bg); color: var(--bad); }
    .wait { background: var(--gold-soft); color: #8A5A00; }

    .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: #fff; border: 1px dashed var(--line); border-radius: 16px; }
    .error { padding: 10px 14px; border-radius: 12px; margin: 12px 0 0; background: var(--bad-bg); color: var(--bad); font-size: .92rem; text-align: left; }
    .loading { opacity: .55; pointer-events: none; transition: opacity .2s; }

    .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 999px; font-size: .92rem; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); z-index: 10; }

    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .tabs button { padding: 0 12px; font-size: .88rem; }
      header p { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="head-inner">
      <img src="/assets/decorations/crown.svg" alt="" />
      <div>
        <h1>Organizer Dashboard</h1>
        <p>Krishiv Turns One · RSVPs and birthday wishes</p>
      </div>
      <button type="button" id="logout" class="sm hidden">Lock</button>
    </div>
  </header>

  <main>
    <section id="login" class="login">
      <img src="/assets/decorations/seal.svg" alt="" />
      <h2>Welcome back</h2>
      <p>Enter the organizer password to see RSVPs and approve wishes.</p>
      <form id="login-form">
        <label for="token">Password</label>
        <input id="token" type="password" autocomplete="current-password" required />
        <button class="primary" type="submit" id="login-btn">Open dashboard</button>
        <p id="login-error" class="error hidden" role="alert"></p>
      </form>
    </section>

    <section id="dash" class="hidden">
      <div class="stats" id="stats"></div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="rsvps" aria-selected="true">RSVPs</button>
        <button type="button" role="tab" data-tab="pending" aria-selected="false">To approve<span class="badge" id="pending-count"></span></button>
        <button type="button" role="tab" data-tab="approved" aria-selected="false">Published</button>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by name, phone or message" aria-label="Search" />
        <button type="button" class="ghost" id="refresh">Refresh</button>
        <button type="button" class="gold" id="csv">Download CSV</button>
      </div>

      <div id="list" class="list"></div>
      <p id="empty" class="empty hidden"></p>
      <p id="dash-error" class="error hidden" role="alert"></p>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
